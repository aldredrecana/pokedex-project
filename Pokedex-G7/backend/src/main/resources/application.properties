spring.application.name=pokedex-api

# ──────────────────────────────────────────
# PostgreSQL Database
# ──────────────────────────────────────────
# These values are overridden by Docker environment variables.
# For local dev without Docker, update these to match your local PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pokedexdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pokedex_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pokedex_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ──────────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────────
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
# 'update' preserves data between restarts; use 'create-drop' for a fresh DB each time
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ──────────────────────────────────────────
# CORS — allow frontend origin
# ──────────────────────────────────────────
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500

# ──────────────────────────────────────────
# Server
# ──────────────────────────────────────────
server.port=${SERVER_PORT:8080}
